name: publish

# Rebuilds the apt and dnf repository from the GitHub Releases of rfabric/cli and
# rfabric/agent and deploys it to GitHub Pages (https://linux.rfabric.io). The cli-src and
# agent-src release workflows send `release-published` once a release's assets are uploaded.
on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c

      - name: Import signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "SIGNING_KEY=$fingerprint" >> "$GITHUB_ENV"

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: https://linux.rfabric.io
        run: ./build.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
